name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore code-map.slnx
      - run: dotnet build code-map.slnx --configuration Release --no-restore
      - run: dotnet test code-map.slnx --configuration Release --no-build
